# Temporary scope: exact preparation and READY deployment pinned by root.
name: Temporary Driftwing gameplay browser checks
on:
  push:
    branches: [qa/driftwing-gameplay-20261105]
permissions:
  contents: read
concurrency:
  group: driftwing-gameplay-20261105
  cancel-in-progress: false
jobs:
  gameplay:
    if: github.event_name == 'push' && github.repository == 'alvarovillalbaa/driftwing' && github.event.repository.private == false && github.ref == 'refs/heads/qa/driftwing-gameplay-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      CI: 'true'
      SOURCE_COMMIT: f6967a792831d400644994deda9e919a181f26c5
      DRIFTWING_EXPECTED_DEPLOYMENT: dpl_5AdRq9wwfavnwXGtRsNNWFr6PF7s
      DRIFTWING_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          clean: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Run only the pinned Driftwing gameplay packet
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DRIFTWING_EXPECTED_DEPLOYMENT" =~ ^dpl_[A-Za-z0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          node scripts/gameplay-browser-controller.mjs --source-commit "$SOURCE_COMMIT"
